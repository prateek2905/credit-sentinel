services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: credit_sentinel
      POSTGRES_USER: credit
      POSTGRES_PASSWORD: credit
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credit -d credit_sentinel"]
      interval: 5s
      timeout: 5s
      retries: 12
